[package]
name = "pixi-pack"
description = "A command line tool to pack and unpack conda environments for easy sharing"
version = "0.7.12"
edition = "2024"

# See https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"

[features]
default = ["native-tls"]
native-tls = [
  "reqwest/native-tls",
  "rattler/native-tls",
  "rattler_networking/native-tls",
  "rattler_package_streaming/native-tls",
]
rustls = [
  "reqwest/rustls",
  "rattler/rustls",
  "rattler_networking/rustls",
  "rattler_package_streaming/rustls",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
futures = "0.3.34"
indicatif = "0.18.6"
rattler = { version = "0.55.5", default-features = false }
rattler_config = "0.12.0"
rattler_digest = { version = "2.1.0", features = ["tokio"] }
rattler_conda_types = "0.58.1"
rattler_index = "0.34.5"
rattler_lock = "0.34.12"
rattler_networking = { version = "0.34.6", default-features = false, features = [
  "s3",
  "gcs",
  "rattler_config",
  "system-integration",
] }
rattler_package_streaming = { version = "0.28.3", default-features = false }
rattler_shell = "0.29.7"
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34" # todo: use a non-deprecated crate
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "default",
  "env-filter",
] }
url = "2.5.8"
tempfile = "3.27.0"
walkdir = "2.5.0"
tar = "0.4.46"
base64 = "0.23.1"
indexmap = "2.14.2"
ahash = "0.8.12"
uv-build-frontend = "0.0.98"
uv-cache = "0.0.98"
uv-client = "0.0.98"
uv-configuration = "0.0.98"
uv-dispatch = "0.0.98"
uv-distribution = "0.0.98"
uv-distribution-filename = "0.0.98"
uv-distribution-types = "0.0.98"
uv-git = "0.0.98"
uv-installer = "0.0.98"
uv-pep508 = "0.0.98"
uv-preview = "0.0.98"
uv-python = "0.0.90"
uv-threads = "0.0.98"
uv-types = "0.0.98"
uv-workspace = "0.0.98"

[dev-dependencies]
async-std = "1.13.2"
rstest = "0.28.0"
sha2 = "0.11.1"
insta = "1.49.0"
serial_test = "4.0.1"
