[workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-64", "osx-arm64"]

# Pin the compiler so the run_exports floor of the built packages (e.g.
# `libstdcxx >=15`) stays stable. `pixi publish` re-solves the build
# environment against live conda-forge, while the runtime environment comes
# from this lockfile, so an unpinned compiler breaks the two apart whenever
# conda-forge migrates to a new compiler. win-64 is not pinned here: its
# `cxx_compiler` variant is `vs2022`, which takes no numeric version.
[workspace.target.linux-64.build-variants]
c_compiler_version = ["15"]
cxx_compiler_version = ["15"]

[workspace.target.linux-aarch64.build-variants]
c_compiler_version = ["15"]
cxx_compiler_version = ["15"]

[workspace.target.osx-64.build-variants]
c_compiler_version = ["22"]
cxx_compiler_version = ["22"]

[workspace.target.osx-arm64.build-variants]
c_compiler_version = ["22"]
cxx_compiler_version = ["22"]

# `pixi publish` (which pixi-pack uses to build source packages) only builds
# self-contained packages, so source packages must not depend on each other.
[dependencies]
local-build-main-pkg = { path = "." }
local-build-local-pkg = { path = "./local-pkg" }
local-build-local-pkg-2 = { path = "./local-pkg2" }

[package]
name = "local-build-main-pkg"
version = "0.1.0"

[package.build]
# xref: https://github.com/prefix-dev/pixi/issues/6524
backend = { name = "pixi-build-cmake", version = "==0.4.7" }

[tool.update]
autoupdate-schedule = "never"
