name: CI
on:
  pull_request:
  push:
    branches: [main]

# Automatically stop old builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  pre-commit-checks:
    name: Pre-commit Checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          environments: default lint
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: pre-commit
      - name: pre-commit
        run: pixi run pre-commit-run --color=always --show-diff-on-failure

  # Checks for duplicate version of package
  cargo-vendor:
    name: Cargo Vendor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          activate-environment: true
      - name: Test cargo vendor
        run: cargo vendor --locked

  unit-tests:
    name: test
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          # wait for win-arm64 packages to be available
          # https://github.com/conda-forge/conda-forge.github.io/issues/1940
          # - windows-11-arm
          - macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          activate-environment: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: tests
      - name: Run test
        run: pixi run test --color always${{ startsWith(matrix.os, 'ubuntu') && ' --no-default-features --features rustls' || '' }}

  create-app:
    name: create-app
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          activate-environment: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: create-app
      - name: Install Flatpak
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          # Ubuntu restricts the user namespaces the Flatpak sandbox (bubblewrap) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run unit tests
        run: cargo test --locked --features app --lib --color always
      - name: Build
        run: cargo build --locked --features app --bins --color always
      - name: Create and launch application
        shell: bash
        run: tests/app/smoke-test.sh target/debug/pixi-pack target/debug/pixi-launcher target/debug/pixi-unpack
      - name: Create and launch application downloading its packages
        shell: bash
        env:
          DOWNLOAD_PACKAGES: 1
        run: tests/app/smoke-test.sh target/debug/pixi-pack target/debug/pixi-launcher target/debug/pixi-unpack
